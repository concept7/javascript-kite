# stages:
#     - install
#     - deploy

stages:
    - versions
    # - dotenv
    - install
    # - code-style
    - build
    # - test # https://docs.gitlab.com/ee/user/application_security/sast
    - deploy
    # - prepare
    # - release

node:
    stage: install
    image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:${NODE_VERSION}
    script:
        - export GITHUB_PACKAGE_REGISTRY_TOKEN=$GITHUB_PACKAGE_REGISTRY_TOKEN
        - npm ci
    artifacts:
        paths:
            - node_modules
        expire_in: 1 days
        when: always
    tags:
        - javascript
    needs:
        - job: versions

build-package:
    stage: build
    image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:${NODE_VERSION}
    script:
        - npm run build

    artifacts:
        paths:
            - dist/*
        expire_in: 1 days
        when: always

    needs:
        - job: versions
        - job: node
    tags:
        - javascript

publish-package:
    stage: deploy
    image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:${NODE_VERSION}
    script:
        - echo "@concept7:registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
        - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
        - npm run publish

    needs:
        - job: versions
        - job: node
        - job: build-package

    only:
        refs:
            - tags
        variables:
            - $CI_COMMIT_TAG != $TAG_NAME

versions:
    image: alpine:latest
    stage: versions
    script:
        - |
            if [[ -s .nvmrc ]]; then
              RAW_NODE_VERSION=$(cat .nvmrc)
              NODE_VERSION=$(echo "$RAW_NODE_VERSION" | sed -E 's/^v?([^\/]+).*/\1/')
              echo "NODE_VERSION=$NODE_VERSION" >> build.env
              echo "✅ Found Node version: $NODE_VERSION"
            fi

variables:
    NODE_VERSION: "16.14.2"
